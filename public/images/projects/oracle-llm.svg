<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOracle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051210" />
      <stop offset="50%" stop-color="#09241f" />
      <stop offset="100%" stop-color="#020908" />
    </linearGradient>
    <radialGradient id="aiGlow" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgOracle)" />
  <circle cx="520" cy="160" r="240" fill="url(#aiGlow)" />

  <!-- Window Frame -->
  <rect x="70" y="45" width="660" height="360" rx="16" fill="#071b18" stroke="#045757" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="70" y="45" width="660" height="42" rx="16" fill="#0b2823" />
  <circle cx="102" cy="66" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="120" cy="66" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="138" cy="66" r="5" fill="#10B981" opacity="0.8" />
  <text x="400" y="71" fill="#B0E4CC" font-family="monospace" font-size="12" text-anchor="middle">ORACLE-LLM // LOCAL CSV QA API (SmolLM2)</text>

  <!-- Left: CSV Upload & Pipeline Chain -->
  <g transform="translate(100, 105)">
    <!-- Upload Box -->
    <rect x="0" y="0" width="180" height="75" rx="10" fill="#051412" stroke="#045757" stroke-width="1" />
    <text x="15" y="25" fill="#2DD4BF" font-family="monospace" font-size="10">CSV DATA HANDLER</text>
    <text x="15" y="48" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">sales_data.csv</text>
    <text x="15" y="65" fill="#B0E4CC" font-family="monospace" font-size="9" opacity="0.7">14 COLUMNS // PANDAS</text>

    <!-- Pipeline Step 1 -->
    <rect x="0" y="90" width="180" height="50" rx="8" fill="#08211d" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.4" />
    <text x="15" y="112" fill="#2DD4BF" font-family="monospace" font-size="10">1. DataSelector</text>
    <text x="15" y="128" fill="#B0E4CC" font-family="sans-serif" font-size="10" opacity="0.8">Filters relevant rows</text>

    <!-- Pipeline Step 2 -->
    <rect x="0" y="152" width="180" height="50" rx="8" fill="#08211d" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.4" />
    <text x="15" y="174" fill="#2DD4BF" font-family="monospace" font-size="10">2. LLMRunner</text>
    <text x="15" y="190" fill="#B0E4CC" font-family="sans-serif" font-size="10" opacity="0.8">SmolLM2-1.7B-Instruct</text>

    <!-- Pipeline Step 3 -->
    <rect x="0" y="214" width="180" height="50" rx="8" fill="#08211d" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.4" />
    <text x="15" y="236" fill="#2DD4BF" font-family="monospace" font-size="10">3. ResponseParser</text>
    <text x="15" y="252" fill="#B0E4CC" font-family="sans-serif" font-size="10" opacity="0.8">JSON schema output</text>
  </g>

  <!-- Right: Question & LLM Response Simulation -->
  <g transform="translate(310, 105)">
    <!-- API Request Box -->
    <rect x="0" y="0" width="390" height="85" rx="10" fill="#051412" stroke="#045757" stroke-width="1" />
    <rect x="15" y="15" width="75" height="20" rx="4" fill="#009688" opacity="0.3" />
    <text x="52" y="29" fill="#2DD4BF" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">POST /ai/ask</text>
    <text x="100" y="29" fill="#B0E4CC" font-family="monospace" font-size="11">Content-Type: application/json</text>
    <text x="15" y="58" fill="#F0F5F0" font-family="monospace" font-size="11">"question": "Which product sold the most units?"</text>

    <!-- LLM Response Box -->
    <rect x="0" y="100" width="390" height="165" rx="10" fill="#051412" stroke="#2DD4BF" stroke-width="1.2" />
    <text x="15" y="125" fill="#2DD4BF" font-family="monospace" font-size="10">ORACLE INFERENCE // STATUS: 200 OK</text>
    
    <g transform="translate(15, 140)" font-family="monospace" font-size="11">
      <text x="0" y="15" fill="#B0E4CC">&#123;</text>
      <text x="15" y="35" fill="#2DD4BF">"answer":</text>
      <text x="85" y="35" fill="#FFFFFF">"Model X Pro with 4,210 units"</text>
      <text x="15" y="55" fill="#2DD4BF">"confidence":</text>
      <text x="110" y="55" fill="#FFFFFF">0.96</text>
      <text x="15" y="75" fill="#2DD4BF">"model":</text>
      <text x="75" y="75" fill="#FFFFFF">"SmolLM2-1.7B-Instruct"</text>
      <text x="15" y="95" fill="#2DD4BF">"device":</text>
      <text x="85" y="95" fill="#FFFFFF">"Local CPU (Torch)"</text>
      <text x="0" y="115" fill="#B0E4CC">&#125;</text>
    </g>
  </g>
</svg>

