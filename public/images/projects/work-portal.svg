<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPortal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051412" />
      <stop offset="50%" stop-color="#08211d" />
      <stop offset="100%" stop-color="#030c0a" />
    </linearGradient>
    <radialGradient id="portalGlow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#408A71" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#045757" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgPortal)" />
  <circle cx="240" cy="135" r="240" fill="url(#portalGlow)" />

  <!-- Window Frame -->
  <rect x="70" y="50" width="660" height="350" rx="16" fill="#081c19" stroke="#045757" stroke-width="1.5" />
  
  <!-- Top Nav Bar -->
  <rect x="70" y="50" width="660" height="45" rx="16" fill="#0b2823" />
  <circle cx="105" cy="72" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="123" cy="72" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="141" cy="72" r="5" fill="#10B981" opacity="0.8" />

  <text x="180" y="77" fill="#2DD4BF" font-family="sans-serif" font-weight="bold" font-size="14">CUSTOMER PORTAL</text>
  <rect x="520" y="60" width="180" height="25" rx="12" fill="#051412" stroke="#045757" stroke-width="1" />
  <text x="610" y="76" fill="#B0E4CC" font-family="monospace" font-size="10" text-anchor="middle">ROLE: ADMIN // VERIFIED</text>

  <!-- Metric Badges Row -->
  <g transform="translate(100, 115)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="180" height="75" rx="10" fill="#051613" stroke="#045757" stroke-width="1" />
    <text x="20" y="28" fill="#B0E4CC" font-family="monospace" font-size="11">TOTAL TICKETS</text>
    <text x="20" y="60" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="24">1,482</text>
    
    <!-- Box 2 -->
    <rect x="205" y="0" width="180" height="75" rx="10" fill="#051613" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.5" />
    <text x="225" y="28" fill="#2DD4BF" font-family="monospace" font-size="11">RESOLVED</text>
    <text x="225" y="60" fill="#2DD4BF" font-family="sans-serif" font-weight="bold" font-size="24">98.4%</text>

    <!-- Box 3 -->
    <rect x="410" y="0" width="180" height="75" rx="10" fill="#051613" stroke="#045757" stroke-width="1" />
    <text x="430" y="28" fill="#B0E4CC" font-family="monospace" font-size="11">AVG RESPONSE</text>
    <text x="430" y="60" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="24">12 MIN</text>
  </g>

  <!-- Data Table UI Mockup -->
  <g transform="translate(100, 210)">
    <rect x="0" y="0" width="590" height="165" rx="10" fill="#051613" stroke="#045757" stroke-width="1" />
    
    <!-- Table Header -->
    <rect x="0" y="0" width="590" height="35" rx="10" fill="#0b2420" />
    <text x="25" y="22" fill="#B0E4CC" font-family="monospace" font-size="11">CASE ID</text>
    <text x="140" y="22" fill="#B0E4CC" font-family="monospace" font-size="11">CUSTOMER</text>
    <text x="320" y="22" fill="#B0E4CC" font-family="monospace" font-size="11">STATUS</text>
    <text x="480" y="22" fill="#B0E4CC" font-family="monospace" font-size="11">DATE</text>

    <!-- Row 1 -->
    <line x1="0" y1="75" x2="590" y2="75" stroke="#045757" stroke-opacity="0.4" />
    <text x="25" y="60" fill="#2DD4BF" font-family="monospace" font-size="11">#CR-9821</text>
    <text x="140" y="60" fill="#F0F5F0" font-family="sans-serif" font-size="12">Nordic Logistics AB</text>
    <rect x="320" y="46" width="70" height="20" rx="10" fill="#045757" opacity="0.6" />
    <text x="355" y="60" fill="#2DD4BF" font-family="monospace" font-size="10" text-anchor="middle">ACTIVE</text>
    <text x="480" y="60" fill="#B0E4CC" font-family="monospace" font-size="11" opacity="0.7">2026-03-12</text>

    <!-- Row 2 -->
    <line x1="0" y1="120" x2="590" y2="120" stroke="#045757" stroke-opacity="0.4" />
    <text x="25" y="103" fill="#2DD4BF" font-family="monospace" font-size="11">#CR-9820</text>
    <text x="140" y="103" fill="#F0F5F0" font-family="sans-serif" font-size="12">Stockholm Cloud Co</text>
    <rect x="320" y="89" width="70" height="20" rx="10" fill="#10B981" opacity="0.25" />
    <text x="355" y="103" fill="#10B981" font-family="monospace" font-size="10" text-anchor="middle">CLOSED</text>
    <text x="480" y="103" fill="#B0E4CC" font-family="monospace" font-size="11" opacity="0.7">2026-03-10</text>
  </g>
</svg>

