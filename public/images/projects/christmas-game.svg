<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgXmas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a16" />
      <stop offset="50%" stop-color="#0e2922" />
      <stop offset="100%" stop-color="#040c0a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgXmas)" />

  <!-- App Window -->
  <rect x="140" y="45" width="520" height="360" rx="20" fill="#061613" stroke="#045757" stroke-width="1.5" />
  
  <text x="400" y="90" fill="#2DD4BF" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">CHRISTMAS GIFT GAME</text>
  <text x="400" y="115" fill="#B0E4CC" font-family="monospace" font-size="12" text-anchor="middle" opacity="0.8">.NET MAUI // CROSS-PLATFORM</text>

  <!-- Interactive Game Board Card Mockups -->
  <g transform="translate(190, 140)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="125" height="170" rx="12" fill="#0b2420" stroke="#045757" stroke-width="1.5" />
    <text x="62" y="75" font-size="36" text-anchor="middle">🎁</text>
    <text x="62" y="115" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">GIFT #1</text>
    <rect x="25" y="135" width="75" height="20" rx="10" fill="#2DD4BF" opacity="0.3" />
    <text x="62" y="149" fill="#2DD4BF" font-family="monospace" font-size="9" text-anchor="middle">STEAL</text>

    <!-- Card 2 (Active) -->
    <rect x="145" y="-10" width="130" height="185" rx="12" fill="#0e322a" stroke="#2DD4BF" stroke-width="2" />
    <text x="210" y="70" font-size="42" text-anchor="middle">🎲</text>
    <text x="210" y="120" fill="#2DD4BF" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">ROLL DICE</text>
    <rect x="170" y="142" width="80" height="22" rx="11" fill="#2DD4BF" />
    <text x="210" y="157" fill="#041210" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">PLAYER 2</text>

    <!-- Card 3 -->
    <rect x="295" y="0" width="125" height="170" rx="12" fill="#0b2420" stroke="#045757" stroke-width="1.5" />
    <text x="357" y="75" font-size="36" text-anchor="middle">🎄</text>
    <text x="357" y="115" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">GIFT #2</text>
    <rect x="320" y="135" width="75" height="20" rx="10" fill="#408A71" opacity="0.3" />
    <text x="357" y="149" fill="#B0E4CC" font-family="monospace" font-size="9" text-anchor="middle">OPEN</text>
  </g>

  <!-- Timer Bar -->
  <rect x="220" y="345" width="360" height="8" rx="4" fill="#041210" />
  <rect x="220" y="345" width="240" height="8" rx="4" fill="#2DD4BF" />
  <text x="400" y="375" fill="#B0E4CC" font-family="monospace" font-size="11" text-anchor="middle">ROUND 3 // TIME REMAINING: 01:45</text>
</svg>

