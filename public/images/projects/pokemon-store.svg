<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPoke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051210" />
      <stop offset="50%" stop-color="#09201b" />
      <stop offset="100%" stop-color="#030b09" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgPoke)" />

  <!-- E-commerce Window -->
  <rect x="90" y="50" width="620" height="350" rx="16" fill="#071815" stroke="#045757" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="90" y="50" width="620" height="44" rx="16" fill="#0a2520" />
  <text x="120" y="77" fill="#2DD4BF" font-family="sans-serif" font-weight="bold" font-size="15">POKÉMON TCG STORE</text>
  <rect x="580" y="59" width="110" height="26" rx="13" fill="#2DD4BF" opacity="0.2" stroke="#2DD4BF" stroke-width="1" />
  <text x="635" y="76" fill="#2DD4BF" font-family="monospace" font-size="11" text-anchor="middle">CART (3) 🛒</text>

  <!-- Filter chips -->
  <g transform="translate(120, 110)">
    <rect x="0" y="0" width="65" height="22" rx="6" fill="#2DD4BF" />
    <text x="32" y="15" fill="#041210" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">ALL</text>

    <rect x="75" y="0" width="75" height="22" rx="6" fill="#045757" opacity="0.4" />
    <text x="112" y="15" fill="#B0E4CC" font-family="monospace" font-size="10" text-anchor="middle">HOLO RARE</text>

    <rect x="160" y="0" width="65" height="22" rx="6" fill="#045757" opacity="0.4" />
    <text x="192" y="15" fill="#B0E4CC" font-family="monospace" font-size="10" text-anchor="middle">VMAX</text>
  </g>

  <!-- Product Cards Grid -->
  <g transform="translate(120, 150)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="165" height="225" rx="10" fill="#0b2420" stroke="#045757" stroke-width="1.2" />
    <rect x="15" y="15" width="135" height="130" rx="8" fill="#051412" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="82" cy="75" r="32" fill="#EAB308" opacity="0.3" />
    <text x="82" y="85" font-size="30" text-anchor="middle">⚡</text>
    <text x="20" y="170" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">Charizard Holo</text>
    <text x="20" y="190" fill="#2DD4BF" font-family="monospace" font-size="12">$149.99</text>
    <rect x="105" y="173" width="45" height="20" rx="6" fill="#2DD4BF" />
    <text x="127" y="187" fill="#041210" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">BUY</text>

    <!-- Card 2 -->
    <rect x="195" y="0" width="165" height="225" rx="10" fill="#0b2420" stroke="#2DD4BF" stroke-width="1.5" />
    <rect x="210" y="15" width="135" height="130" rx="8" fill="#051412" stroke="#2DD4BF" stroke-width="1" />
    <circle cx="277" cy="75" r="32" fill="#3B82F6" opacity="0.3" />
    <text x="277" y="85" font-size="30" text-anchor="middle">💧</text>
    <text x="215" y="170" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">Blastoise VMAX</text>
    <text x="215" y="190" fill="#2DD4BF" font-family="monospace" font-size="12">$119.50</text>
    <rect x="300" y="173" width="45" height="20" rx="6" fill="#2DD4BF" />
    <text x="322" y="187" fill="#041210" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">BUY</text>

    <!-- Card 3 -->
    <rect x="390" y="0" width="165" height="225" rx="10" fill="#0b2420" stroke="#045757" stroke-width="1.2" />
    <rect x="405" y="15" width="135" height="130" rx="8" fill="#051412" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="472" cy="75" r="32" fill="#10B981" opacity="0.3" />
    <text x="472" y="85" font-size="30" text-anchor="middle">🍃</text>
    <text x="410" y="170" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">Venusaur EX</text>
    <text x="410" y="190" fill="#2DD4BF" font-family="monospace" font-size="12">$89.00</text>
    <rect x="495" y="173" width="45" height="20" rx="6" fill="#2DD4BF" />
    <text x="517" y="187" fill="#041210" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">BUY</text>
  </g>
</svg>

