<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTerminal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#0e0d10" />
      <stop offset="100%" stop-color="#070708" />
    </linearGradient>
    <radialGradient id="starGlow" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dd7be5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgTerminal)" />
  <circle cx="320" cy="225" r="220" fill="url(#starGlow)" />

  <!-- Terminal Window -->
  <rect x="75" y="65" width="650" height="320" rx="14" fill="#0f0e0f" stroke="#252426" stroke-width="1.5" />
  
  <!-- Terminal Top Bar -->
  <rect x="75" y="65" width="650" height="40" rx="14" fill="#151417" />
  <circle cx="105" cy="85" r="5" fill="#fb779c" opacity="0.8" />
  <circle cx="123" cy="85" r="5" fill="#f7b731" opacity="0.8" />
  <circle cx="141" cy="85" r="5" fill="#08cad3" opacity="0.8" />
  <text x="400" y="90" fill="#a0a0a5" font-family="monospace" font-size="12" text-anchor="middle">alacritty / zsh — STARSHIP // CHILL NIGHT PROMPT</text>

  <!-- Starship Prompt Simulation -->
  <g transform="translate(105, 150)">
    <!-- Prompt 1: User / Directory / Git -->
    <g transform="translate(0, 0)">
      <!-- Segment 1: User (Purple) -->
      <path d="M0,0 L90,0 L102,15 L90,30 L0,30 Z" fill="#dd7be5" />
      <text x="12" y="20" fill="#0f0e0f" font-family="monospace" font-weight="bold" font-size="12"> mikael</text>

      <!-- Segment 2: Directory (Blue) -->
      <path d="M90,0 L240,0 L252,15 L240,30 L90,30 L102,15 Z" fill="#61afef" />
      <text x="110" y="20" fill="#0f0e0f" font-family="monospace" font-weight="bold" font-size="12"> repos/portfolio</text>

      <!-- Segment 3: Git Branch (Teal) -->
      <path d="M240,0 L360,0 L372,15 L360,30 L240,30 L252,15 Z" fill="#08cad3" />
      <text x="260" y="20" fill="#0f0e0f" font-family="monospace" font-weight="bold" font-size="12"> main !⇡</text>

      <!-- Segment 4: Runtime (.NET / Pink) -->
      <path d="M360,0 L460,0 L472,15 L460,30 L360,30 L372,15 Z" fill="#fb779c" />
      <text x="380" y="20" fill="#0f0e0f" font-family="monospace" font-weight="bold" font-size="12">󰌛 .NET 9.0</text>
    </g>

    <!-- Terminal Command -->
    <text x="0" y="65" fill="#08cad3" font-family="monospace" font-size="13">➜ <tspan fill="#ffffff">git status --short</tspan></text>
    <text x="0" y="90" fill="#58585a" font-family="monospace" font-size="12">M  public/data/myprojects.json</text>
    <text x="0" y="110" fill="#fb779c" font-family="monospace" font-size="12">?? public/images/projects/chill-night-starship.svg</text>

    <!-- Next Prompt Bar -->
    <g transform="translate(0, 140)">
      <!-- Segment 1: User -->
      <path d="M0,0 L90,0 L102,15 L90,30 L0,30 Z" fill="#dd7be5" />
      <text x="12" y="20" fill="#0f0e0f" font-family="monospace" font-weight="bold" font-size="12"> mikael</text>

      <!-- Segment 2: Directory -->
      <path d="M90,0 L240,0 L252,15 L240,30 L90,30 L102,15 Z" fill="#61afef" />
      <text x="110" y="20" fill="#0f0e0f" font-family="monospace" font-weight="bold" font-size="12"> repos/portfolio</text>

      <!-- Segment 3: Git Branch -->
      <path d="M240,0 L360,0 L372,15 L360,30 L240,30 L252,15 Z" fill="#08cad3" />
      <text x="260" y="20" fill="#0f0e0f" font-family="monospace" font-weight="bold" font-size="12"> main</text>
    </g>
    <text x="0" y="200" fill="#08cad3" font-family="monospace" font-size="13">➜ <tspan fill="#ffffff" opacity="0.8">_</tspan></text>
  </g>
</svg>

