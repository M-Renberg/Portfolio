<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a090a" />
      <stop offset="50%" stop-color="#0f0e0f" />
      <stop offset="100%" stop-color="#070607" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="80%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#dd7be5" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#08cad3" stop-opacity="0.1" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgChill)" />
  <circle cx="640" cy="110" r="200" fill="url(#moonGlow)" />

  <!-- Moon Crescent Graphic -->
  <g transform="translate(680, 80)">
    <path d="M0,0 A25,25 0 1,0 35,35 A35,35 0 0,1 0,0 Z" fill="#dd7be5" opacity="0.8" />
  </g>

  <!-- Code Editor Window -->
  <rect x="75" y="50" width="650" height="350" rx="14" fill="#0f0e0f" stroke="#252426" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="75" y="50" width="650" height="40" rx="14" fill="#161517" />
  <circle cx="105" cy="70" r="5" fill="#fb779c" opacity="0.8" />
  <circle cx="123" cy="70" r="5" fill="#f7b731" opacity="0.8" />
  <circle cx="141" cy="70" r="5" fill="#08cad3" opacity="0.8" />
  <text x="400" y="75" fill="#a0a0a5" font-family="monospace" font-size="12" text-anchor="middle">CHILL NIGHT MODE // VS CODE THEME</text>

  <!-- Left Sidebar (Explorer) -->
  <rect x="75" y="90" width="130" height="310" fill="#121113" />
  <text x="95" y="115" fill="#58585a" font-family="monospace" font-size="10">EXPLORER</text>
  <rect x="95" y="130" width="90" height="8" rx="2" fill="#58585a" opacity="0.6" />
  <rect x="95" y="148" width="70" height="8" rx="2" fill="#dd7be5" opacity="0.5" />
  <rect x="95" y="166" width="80" height="8" rx="2" fill="#58585a" opacity="0.4" />
  <rect x="95" y="184" width="60" height="8" rx="2" fill="#58585a" opacity="0.4" />

  <!-- Code Area with Chill Night Syntax Colors -->
  <g transform="translate(230, 115)" font-family="monospace" font-size="13">
    <!-- Line numbers -->
    <text x="0" y="25" fill="#58585a">01</text>
    <text x="0" y="50" fill="#58585a">02</text>
    <text x="0" y="75" fill="#58585a">03</text>
    <text x="0" y="100" fill="#58585a">04</text>
    <text x="0" y="125" fill="#58585a">05</text>
    <text x="0" y="150" fill="#58585a">06</text>
    <text x="0" y="175" fill="#58585a">07</text>
    <text x="0" y="200" fill="#58585a">08</text>

    <!-- Syntax Code -->
    <text x="35" y="25" fill="#58585a">// Chill Night Mode — Eye-care midnight palette</text>
    <text x="35" y="50" fill="#dd7be5">import</text>
    <text x="95" y="50" fill="#fb779c">&#123; createTheme &#125;</text>
    <text x="250" y="50" fill="#dd7be5">from</text>
    <text x="290" y="50" fill="#08cad3">'chill-night'</text>

    <text x="35" y="100" fill="#dd7be5">const</text>
    <text x="85" y="100" fill="#61afef">palette</text>
    <text x="150" y="100" fill="#08cad3">=</text>
    <text x="170" y="100" fill="#fb779c">createTheme</text>
    <text x="260" y="100" fill="#ffffff">(&#123;</text>

    <text x="60" y="125" fill="#fb779c">background</text>
    <text x="150" y="125" fill="#ffffff">:</text>
    <text x="165" y="125" fill="#08cad3">'#0f0e0f'</text>
    <text x="245" y="125" fill="#ffffff">,</text>

    <text x="60" y="150" fill="#fb779c">eyeCare</text>
    <text x="125" y="150" fill="#ffffff">:</text>
    <text x="140" y="150" fill="#61afef">true</text>
    <text x="175" y="150" fill="#ffffff">,</text>

    <text x="60" y="175" fill="#fb779c">contrast</text>
    <text x="135" y="175" fill="#ffffff">:</text>
    <text x="150" y="175" fill="#08cad3">'balanced-comfort'</text>

    <text x="35" y="200" fill="#ffffff">&#125;);</text>
  </g>

  <!-- Color Palette Swatches -->
  <g transform="translate(230, 345)">
    <circle cx="10" cy="10" r="10" fill="#0f0e0f" stroke="#58585a" stroke-width="1.5" />
    <circle cx="45" cy="10" r="10" fill="#fb779c" />
    <circle cx="80" cy="10" r="10" fill="#61afef" />
    <circle cx="115" cy="10" r="10" fill="#dd7be5" />
    <circle cx="150" cy="10" r="10" fill="#08cad3" />
    <circle cx="185" cy="10" r="10" fill="#58585a" />
    <text x="215" y="14" fill="#a0a0a5" font-family="monospace" font-size="11">PALETTE: MIDNIGHT // PINK // BLUE // PURPLE // TEAL</text>
  </g>
</svg>

