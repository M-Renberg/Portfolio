<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChurn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051412" />
      <stop offset="50%" stop-color="#0a2620" />
      <stop offset="100%" stop-color="#020807" />
    </linearGradient>
    <radialGradient id="churnGlow" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgChurn)" />
  <circle cx="560" cy="180" r="220" fill="url(#churnGlow)" />

  <!-- App Window -->
  <rect x="70" y="45" width="660" height="360" rx="16" fill="#071b18" stroke="#045757" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="70" y="45" width="660" height="44" rx="16" fill="#0b2823" />
  <circle cx="102" cy="67" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="120" cy="67" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="138" cy="67" r="5" fill="#10B981" opacity="0.8" />
  <text x="400" y="72" fill="#2DD4BF" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">STREAMLIT // TELCO CUSTOMER CHURN PREDICTION</text>

  <!-- Left: Customer Feature Sliders -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="230" height="260" rx="10" fill="#051412" stroke="#045757" stroke-width="1" />
    <text x="15" y="25" fill="#2DD4BF" font-family="monospace" font-size="11" font-weight="bold">CUSTOMER ATTRIBUTES</text>

    <!-- Slider 1: Tenure -->
    <text x="15" y="55" fill="#B0E4CC" font-family="sans-serif" font-size="11">Tenure: 4 Months</text>
    <rect x="15" y="65" width="200" height="6" rx="3" fill="#09241f" />
    <rect x="15" y="65" width="40" height="6" rx="3" fill="#2DD4BF" />
    <circle cx="55" cy="68" r="6" fill="#2DD4BF" />

    <!-- Slider 2: Monthly Charges -->
    <text x="15" y="105" fill="#B0E4CC" font-family="sans-serif" font-size="11">Monthly Charges: $92.50</text>
    <rect x="15" y="115" width="200" height="6" rx="3" fill="#09241f" />
    <rect x="15" y="115" width="150" height="6" rx="3" fill="#2DD4BF" />
    <circle cx="165" cy="118" r="6" fill="#2DD4BF" />

    <!-- Selector: Contract Type -->
    <text x="15" y="155" fill="#B0E4CC" font-family="sans-serif" font-size="11">Contract: Month-to-month</text>
    <rect x="15" y="165" width="200" height="24" rx="6" fill="#0a2620" stroke="#045757" stroke-width="1" />
    <text x="25" y="181" fill="#F0F5F0" font-family="sans-serif" font-size="10">Month-to-month (High Risk)</text>

    <!-- Predict Button -->
    <rect x="15" y="210" width="200" height="34" rx="8" fill="#EF4444" />
    <text x="115" y="232" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">PREDICT CHURN RISK</text>
  </g>

  <!-- Right: Churn Risk Prediction Output -->
  <g transform="translate(355, 110)">
    <!-- Result Card -->
    <rect x="0" y="0" width="345" height="150" rx="10" fill="#051412" stroke="#EF4444" stroke-width="1.5" />
    <text x="20" y="32" fill="#EF4444" font-family="monospace" font-size="12" font-weight="bold">HIGH RISK OF CHURNING</text>
    
    <text x="20" y="85" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="44">74.2%</text>
    <text x="20" y="115" fill="#B0E4CC" font-family="sans-serif" font-size="11">Probability of customer cancelling service</text>

    <!-- Model Specs & API Metric -->
    <rect x="0" y="165" width="345" height="95" rx="10" fill="#051412" stroke="#045757" stroke-width="1" />
    <text x="20" y="192" fill="#2DD4BF" font-family="monospace" font-size="11">FASTAPI INFERENCE WORKFLOW</text>

    <g transform="translate(20, 205)" font-family="monospace" font-size="10" fill="#B0E4CC">
      <text x="0" y="15">• Model: Logistic Regression &amp; XGBoost</text>
      <text x="0" y="32">• Latency: 14ms // FastAPI Port: 8000</text>
    </g>
  </g>
</svg>

